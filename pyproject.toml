[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-rag-workbench"
version = "0.1.0"
description = "多模态个人知识库与可复核 RAG 工作台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.27,<1", "pydantic>=2.8,<3", "python-multipart>=0.0.12", "python-dotenv>=1,<2",
  "langchain-core>=0.3,<2", "langchain-text-splitters>=0.3,<2",
  "pymupdf>=1.24,<2", "rank-bm25>=0.2.2,<1", "jieba>=0.42",
  "numpy>=1.26,<3", "pillow>=10,<13",
  "rapidocr>=3,<4", "onnxruntime>=1.18,<2", "typer>=0.12,<1", "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
semantic = ["sentence-transformers>=3,<6"]
eval = ["ragas>=0.3,<1", "langchain-openai>=0.3,<2"]

[project.scripts]
rag-workbench = "rag_workbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/rag_workbench/cli.py" = ["B008"]
